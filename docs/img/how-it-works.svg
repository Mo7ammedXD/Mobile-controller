<text x="1035" y="246.0" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" fill="#DCE6F0" text-anchor="middle" xml:space="preserve">Xbox 360 or DualShock 4</text>
<text x="1035" y="266.0" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">a real controller to Windows</text>
