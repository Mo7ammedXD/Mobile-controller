<text x="1035" y="356.0" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" fill="#DCE6F0" text-anchor="middle" xml:space="preserve">Your game</text>
<text x="1035" y="376.0" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">XInput, DirectInput, Steam Input</text>
