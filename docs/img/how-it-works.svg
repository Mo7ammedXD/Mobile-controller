<circle cx="319" cy="174" r="11" fill="#E5383B" stroke="#E5383B" stroke-width="2" fill-opacity="0.22"/>
<text x="319" y="178" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#E5383B" text-anchor="middle" xml:space="preserve">B</text>
<circle cx="295" cy="198" r="11" fill="#5BC236" stroke="#5BC236" stroke-width="2" fill-opacity="0.22"/>
<text x="295" y="202" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#5BC236" text-anchor="middle" xml:space="preserve">A</text>
<circle cx="195" cy="120" r="8" fill="#1C232D" stroke="none" stroke-width="1"/>
<text x="195" y="124" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="normal" fill="#B8C4D0" text-anchor="middle" xml:space="preserve">⚙</text>
<rect x="84" y="110" width="50" height="9" rx="4" fill="#E5383B" stroke="#E5383B" stroke-width="1.5" fill-opacity="0.22"/>
<circle cx="46" cy="300" r="3" fill="#4FA3FF" stroke="none" stroke-width="1"/>
<text x="58" y="304" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Touch layouts for each kind of game</text>
<circle cx="46" cy="322" r="3" fill="#4FA3FF" stroke="none" stroke-width="1"/>
<text x="58" y="326" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Gyro aiming and tilt steering</text>
<circle cx="46" cy="344" r="3" fill="#4FA3FF" stroke="none" stroke-width="1"/>
<text x="58" y="348" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Sends the whole controller state on</text>
<text x="58" y="370" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">every change, and at least 120 times</text>
<text x="58" y="392" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">a second</text>
<circle cx="46" cy="410" r="3" fill="#4FA3FF" stroke="none" stroke-width="1"/>
<text x="58" y="414" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Vibrates for buttons and game rumble</text>
<text x="473" y="96" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#DCE6F0" text-anchor="middle" xml:space="preserve">UDP, port 24680</text>
<text x="473" y="114" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">over Wi-Fi or USB tethering</text>
<line x1="362" y1="152" x2="584" y2="152" stroke="#4FA3FF" stroke-width="2" marker-end="url(#blue)"/>
<text x="473" y="144" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#4FA3FF" text-anchor="middle" xml:space="preserve">INPUT</text>
<text x="473" y="169" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">the full state, 16 bytes</text>
<line x1="362" y1="207" x2="584" y2="207" stroke="#4FA3FF" stroke-width="2" marker-end="url(#blue)"/>
<text x="473" y="199" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#4FA3FF" text-anchor="middle" xml:space="preserve">STATUS</text>
<text x="473" y="224" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">name, battery, latency</text>
<line x1="584" y1="262" x2="362" y2="262" stroke="#FFB86B" stroke-width="2" marker-end="url(#orange)"/>
<text x="473" y="254" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFB86B" text-anchor="middle" xml:space="preserve">FEEDBACK</text>
<text x="473" y="279" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">player number, rumble</text>
<line x1="584" y1="317" x2="362" y2="317" stroke="#FFB86B" stroke-width="2" marker-end="url(#orange)"/>
<text x="473" y="309" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFB86B" text-anchor="middle" xml:space="preserve">COMMAND</text>
<text x="473" y="334" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">identify this phone</text>
<line x1="364" y1="382" x2="582" y2="382" stroke="#8B98A8" stroke-width="1.5" stroke-dasharray="5 5" marker-start="url(#grey)" marker-end="url(#grey)"/>
<text x="473" y="374" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#B8C4D0" text-anchor="middle" xml:space="preserve">FIND PC</text>
<text x="473" y="399" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">broadcast; the PC answers</text>
<rect x="590" y="56" width="580" height="516" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<text x="610" y="84" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B98A8" text-anchor="start" xml:space="preserve" letter-spacing="1.5">WINDOWS PC</text>
<rect x="610" y="104" width="280" height="176" rx="12" fill="#1A2433" stroke="#4FA3FF" stroke-width="1.5"/>
<text x="630" y="134" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" fill="#DCE6F0" text-anchor="start" xml:space="preserve">Server</text>
<text x="630" y="154" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="start" xml:space="preserve">MobileController.Server</text>
<text x="630" y="182" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">One virtual pad per phone, up to 4</text>
<text x="630" y="204" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Neutral if a phone goes quiet</text>
<text x="630" y="226" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Sends rumble back to the phone</text>
<text x="630" y="248" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Answers Find PC</text>
<rect x="610" y="362" width="280" height="176" rx="12" fill="#172A20" stroke="#6FD08C" stroke-width="1.5"/>
<text x="630" y="392" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" fill="#DCE6F0" text-anchor="start" xml:space="preserve">Desktop app</text>
<text x="630" y="412" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="start" xml:space="preserve">MobileController.Desktop</text>
<text x="630" y="440" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Starts and watches the server</text>
<text x="630" y="462" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Every phone's status, live</text>
<text x="630" y="484" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">Diagnostics, log and settings</text>
<text x="630" y="506" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="normal" fill="#B8C4D0" text-anchor="start" xml:space="preserve">QR code for connecting</text>
