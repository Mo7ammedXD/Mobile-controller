<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="How Mobile Controller works: the phone sends its controller state over UDP to the server on the PC, which plays it into a virtual controller through ViGEmBus; the desktop app watches and configures the server">
<title>How Mobile Controller works: the phone sends its controller state over UDP to the server on the PC, which plays it into a virtual controller through ViGEmBus; the desktop app watches and configures the server</title>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4FA3FF"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB86B"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B98A8"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FD08C"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="598" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
