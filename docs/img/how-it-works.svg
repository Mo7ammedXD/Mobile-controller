<text x="1035" y="156.0" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">a virtual controller bus</text>
