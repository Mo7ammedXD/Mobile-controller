<text x="676" y="336" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="start" xml:space="preserve">status, log</text>
<text x="824" y="336" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8B98A8" text-anchor="end" xml:space="preserve">commands</text>
