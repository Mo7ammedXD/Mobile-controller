<text x="1035" y="478" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="bold" fill="#DCE6F0" text-anchor="middle" xml:space="preserve">server.json</text>
<text x="1035" y="500" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">settings: the desktop app</text>
<text x="1035" y="518" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B98A8" text-anchor="middle" xml:space="preserve">writes them, the server reads them</text>
